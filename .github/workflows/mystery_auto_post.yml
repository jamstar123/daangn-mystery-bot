name: Busan Mystery Cafe Auto Post (4x Daily by Board)

on:
  schedule:
    # 1) 낮 12시 30분 KST (03:30 UTC): 📷무서운 사진😨 (photo_*)
    - cron: '30 3 * * *'
    # 2) 오후 6시 00분 KST (09:00 UTC): 😱 공포 실화 모음 - 단편 실화 (real_*)
    - cron: '0 9 * * *'
    # 3) 밤 9시 00분 KST (12:00 UTC): 📷무서운 사진😨 (photo_*)
    - cron: '0 12 * * *'
    # 4) 밤 10시 30분 KST (13:30 UTC): 📒 공포 시리즈 모음 - 시리즈물 (series_*)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      prefix:
        description: '발행할 원고 종류 접두사 (photo_, real_, series_ 중 선택, 비워두면 전체 순서대로)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish_mystery:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 시간대별 게시판 맞춤 원고 1건 자동 발행
        env:
          DAANGN_COOKIE: ${{ secrets.DAANGN_COOKIE }}
          MYSTERY_CAFE_SLUG: ${{ secrets.MYSTERY_CAFE_SLUG || 'silhwa-gongposs' }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PREFIX: ${{ github.event.inputs.prefix }}
        run: |
          PREFIX="${INPUT_PREFIX}"
          BOARD="2371046"
          if [ -z "$PREFIX" ]; then
            if [ "$EVENT_SCHEDULE" = "30 3 * * *" ] || [ "$EVENT_SCHEDULE" = "0 12 * * *" ]; then
              PREFIX="photo_"
              BOARD="2371168"
            elif [ "$EVENT_SCHEDULE" = "0 9 * * *" ]; then
              PREFIX="real_"
              BOARD="2371046"
            elif [ "$EVENT_SCHEDULE" = "30 13 * * *" ]; then
              PREFIX="series_"
              BOARD="2371259"
            fi
          fi
          echo "Running mystery_runner.py with prefix='${PREFIX}' and default board='${BOARD}'"
          python3 mystery_runner.py --slug "${MYSTERY_CAFE_SLUG}" --board "${BOARD}" --prefix "${PREFIX}"

      - name: 발행 완료된 원고 이동 내역 커밋 및 푸시
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manuscripts/ logs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "Auto: 괴담/미스터리 카페 원고 발행 완료 및 대기열 업데이트"
            git push
          fi
